<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API</title>

    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #f5f5f5;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>C.R.U.D. padrão API</h1>

    Id <input type="text" id="id" name="id" value="0" size="3" readonly /><br /><br />
    Nome_produto <input type="text" id="nome_produto" name="nome_produto" value="" size="35" /><br /><br />
    Descricao <input type="text" id="descricao" name="descricao" value="" size="20" /><br /><br />
    Preco_venda <input type="text" id="preco_venda" name="preco_venda" value="" size="20" /><br /><br />
    Preco_custo <input type="text" id="preco_custo" name="preco_custo" value="" size="20" /><br /><br />
    Lucro <input type="text" id="lucro" name="lucro" value="" size="20" /><br /><br />
    Quantidade_estoque <input type="text" id="quantidade_estoque" name="quantidade_estoque" value="" size="20" /><br /><br />
    Categoria <input type="text" id="categoria" name="categoria" value="" size="20" /><br /><br />
    


    <button onclick="get()">GET (Consulta/Lista)</button>
    <button onclick="post()">POST (Cadastrar)</button>
    <button onclick="put()">PUT (Alterar)</button>
    <button onclick="del()">DELETE (Excluir)</button>
    <div id="table-container"></div>

    <script>
        async function get() {
            try {
                const response = await fetch("http://localhost/api/testeApi.php/produto/list", {
                    method: "GET",
                    headers: {
                        "Content-Type": "application/json",
                    },
                });
                const data = await response.json();

                let tableHtml = "<table><tr><th>id</th><th>Nome</th><th>Produto</th></tr>";
                data.forEach((item) => {
                    tableHtml += `<tr onclick='selectRow(${item.id}, "${item.nome_produto}", "${item.descricao}", "${item.preco_venda}", "${item.preco_custo}", "${item.lucro}", "${item.quantidade_estoque}", "${item.categoria}")'>`;
                    tableHtml += `<td>${item.id}</td>`;
                    tableHtml += `<td>${item.nome_produto}</td>`;
                    tableHtml += `<td>${item.descricao}</td>`;
                    tableHtml += `<td>${item.preco_venda}</td>`;
                    tableHtml += `<td>${item.preco_custo}</td>`;
                    tableHtml += `<td>${item.lucro}</td>`;
                    tableHtml += `<td>${item.quantidade_estoque}</td>`;
                    tableHtml += `<td>${item.categoria}</td>`;
                    tableHtml += `</tr>`;
                });
                tableHtml += "</table>";

                document.getElementById("table-container").innerHTML = tableHtml;
            } catch (error) {
                console.error("Erro ao executar solicitação GET:", error);
            }
        }

        async function post() {
            try {
			    
                const response = await fetch("http://localhost/api/testeApi.php/produto/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        nome_produto: document.getElementById("nome_produto").value,
                        descricao: document.getElementById("descricao").value,
                        preco_venda:document.getElementById("preco_venda").value,
                        preco_custo:document.getElementById("preco_custo").value,
                        lucro:document.getElementById("lucro").value,
                        quantidade_estoque:document.getElementById("quantidade_estoque").value,
                        categoria:document.getElementById("categoria").value,
                    }),
                });
                const data = await response.json();
                alert(JSON.stringify(data.message));
                get(); // Atualiza a tabela após adicionar
            } catch (error) {
                console.error("Erro ao executar solicitação POST:", error);
            }
        }

        window.onload = get;

        async function put() {
            try {
                const response = await fetch("http://localhost/api/testeApi.php/produto/" + document.getElementByid("id").value, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        nome_produto: document.getElementById("nome_produto").value,
                        descricao: document.getElementById("descricao").value,
                        preco_venda: document.getElementById("preco_venda").value,
                        preco_custo: document.getElementById("preco_custo").value,
                        lucro: document.getElementById("lucro").value,
                        quantidade_estoque: document.getElementById("quantidade_estoque").value,
                        categoria: document.getElementById("categoria").value,
                    }),
                });
                const data = await response.json();
                alert(JSON.stringify(data.message));
                get(); // Atualiza a tabela após editar
            } catch (error) {
                console.error("Erro ao executar solicitação PUT:", error);
            }
        }

        async function del() {
            try {
                const response = await fetch("http://localhost/api/testeApi.php/produto/" + document.getElementById("id").value, {
                    method: "DELETE",
                });
                const data = await response.json();
                alert(JSON.stringify(data.message));
                get(); // Atualiza a tabela após excluir
            } catch (error) {
                console.error("Erro ao executar solicitação DELETE:", error);
            }
        }

        function selectRow(id, nome_produto, descricao, preco_venda, preco_custo, lucro, quantidade_estoque, categoria) {
            document.getElementById("id").value = id;
            document.getElementById("nome_produto").value = nome_produto;
            document.getElementById("descricao").value = descricao;
            document.getElementById("preco_venda").value = preco_venda;
            document.getElementById("preco_custo").value = preco_custo;
            document.getElementById("lucro").value = lucro;
            document.getElementById("quantidade_estoque").value = quantidade_estoque;
            document.getElementById("categoria").value = categoria;
            
        }
    </script>
</body>
</html>
